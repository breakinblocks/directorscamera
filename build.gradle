plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

def snapshotEnv = providers.environmentVariable("SNAPSHOT")
def isSnapshot = snapshotEnv.isPresent() && snapshotEnv.get().toBoolean()

version = "${minecraft_version}-${mod_version}${isSnapshot ? "-SNAPSHOT" : ""}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }
}

repositories {
    mavenLocal()
    maven {
        name = "KubeJS"
        url "https://maven.saps.dev/minecraft"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        name = "Latvian"
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        name = "JitPack"
        url "https://jitpack.io"
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        url "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.ow2.asm") {
            details.useVersion("9.7")
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_full_version}"
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    localRuntime("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") {
        exclude group: "org.ow2.asm"
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            neoforge_loader_version: neoforge_loader_version,
            neo_version_range      : neo_version_range,
            version                : version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_author             : mod_author
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "BreakInBlocks"
            url = isSnapshot ?
                "https://maven.breakinblocks.com/snapshots" :
                "https://maven.breakinblocks.com/releases"
            credentials {
                username = System.getenv("MAVEN_USER") ?: ""
                password = System.getenv("MAVEN_TOKEN") ?: ""
            }
        }
    }
}

publishMods {
    dryRun = providers.environmentVariable("CURSEFORGE_TOKEN").getOrNull() == null
    file = jar.archiveFile
    changelog = file("CHANGELOG.md").text
    version = project.version
    type = STABLE
    modLoaders.add("neoforge")
    displayName = "[${minecraft_version}] ${mod_name} ${mod_version}"

    curseforge {
        projectId = "1679326"
        projectSlug = "directors-camera"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true
        optional("kubejs")
    }

    def modrinthId = providers.environmentVariable("MODRINTH_ID").getOrNull()
    if (modrinthId != null) {
        modrinth {
            projectId = modrinthId
            accessToken = providers.environmentVariable("MODRINTH_TOKEN")
            minecraftVersions.add(minecraft_version)
            optional("kubejs")
        }
    }
}

tasks.register('publishMaven') {
    description = 'Publishes the mod JAR and sources JAR to the BreakInBlocks Maven repository.'
    group = 'publishing'
    dependsOn 'publishMavenJavaPublicationToBreakInBlocksRepository'
}

tasks.register('publishMod') {
    description = 'Publishes the mod to CurseForge and the BreakInBlocks Maven repository.'
    group = 'publishing'
    dependsOn 'publishMods', 'publishMaven'
}

tasks.named('publishMods') {
    finalizedBy 'publishMaven'
}
