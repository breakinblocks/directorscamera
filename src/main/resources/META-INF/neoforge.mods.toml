modLoader = "javafml"
loaderVersion = "[${neoforge_loader_version},)"
license = "All Rights Reserved"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''
Server-driven camera cutscenes, screen shake, timed sounds, hold-to-skip and a director's camera recording item, with a KubeJS API.
'''

[[mixins]]
config = "directorscamera.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "kubejs"
type = "optional"
versionRange = "[26.1.2-8.0.0,)"
ordering = "AFTER"
side = "BOTH"
